plugins {
    id 'com.android.application'
}

android {
    namespace 'be.kiwazo.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'be.kiwazo.tvhome'
        minSdk 34          // the TCL 55C845 runs Android 14
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}
